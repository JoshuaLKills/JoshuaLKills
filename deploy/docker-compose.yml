name: command360

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-command360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-command360}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend]

  cache:
    <<: [*restart, *logging]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  api:
    <<: [*restart, *logging]
    image: ${API_IMAGE:?set API_IMAGE in .env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-command360}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-command360}
      REDIS_URL: redis://cache:6379/0
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      # assumes the api exposes GET /healthz and the image ships wget or curl
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || curl -fsS http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [backend, edge]

  web:
    <<: [*restart, *logging]
    image: ${WEB_IMAGE:?set WEB_IMAGE in .env}
    environment:
      API_URL: http://api:8080
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || curl -fsS http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [edge]

  proxy:
    <<: [*restart, *logging]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [edge]

  # Restarts any container whose healthcheck reports unhealthy.
  # Plain restart policies only cover crashes, not hung processes.
  autoheal:
    <<: [*restart, *logging]
    image: willfarrell/autoheal:1.2.0
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: "15"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  backend:
  edge:

volumes:
  db_data:
  cache_data:
  caddy_data:
  caddy_config:
